<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AM-Tur</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <section class="hero">

    <div class="overlay"></div>

    <div class="content">

      <h1>AM-Tur</h1>

      <p>Discover Armenia With Luxury & Comfort</p>

      <div class="cars">

        <div class="car-card">
          <img src="https://images.unsplash.com/photo-1619767886558-efdc259cde1a?q=80&w=1200&auto=format&fit=crop">
          <h3>Hongqi E-QM5</h3>
        </div>

        <div class="car-card">
          <img src="https://images.unsplash.com/photo-1560958089-b8a1929cea89?q=80&w=1200&auto=format&fit=crop">
          <h3>Tesla Model 3</h3>
        </div>

        <div class="car-card">
          <img src="https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?q=80&w=1200&auto=format&fit=crop">
          <h3>Mercedes V-Class</h3>
        </div>

      </div>

      <div class="slider">

        <img id="slide-image"
          src="https://images.unsplash.com/photo-1563784462040-6b5c5b2f9b2b?q=80&w=1400&auto=format&fit=crop">

        <h2 id="slide-title">Tatev Monastery</h2>

        <button>Watch Video</button>

      </div>

      <!-- QR CODE -->
      <div class="qr-section">
        <h2>Scan AM-Tur</h2>

        <img 
          src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://amtur-project.vercel.app/"
          alt="AM-Tur QR Code"
        />
      </div>

    </div>

  </section>

  <script src="script.js"></script>

</body>
</html>
