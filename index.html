<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AM-Tur</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <section class="hero">

    <div class="overlay"></div>

    <div class="content">

      <!-- LOGO -->
      <div class="top-bar">
        <h1>AM-Tur</h1>
        <p>Discover Armenia With Us</p>
      </div>

      <!-- CARS -->
      <div class="cars">

        <div class="car-card">
          <img src="https://images.unsplash.com/photo-1619767886558-efdc259cde1a?q=80&w=1200&auto=format&fit=crop">
        </div>

        <div class="car-card">
          <img src="https://images.unsplash.com/photo-1560958089-b8a1929cea89?q=80&w=1200&auto=format&fit=crop">
        </div>

        <div class="car-card">
          <img src="https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?q=80&w=1200&auto=format&fit=crop">
        </div>

        <div class="car-card">
          <img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?q=80&w=1200&auto=format&fit=crop">
        </div>

      </div>

      <!-- PLACES -->
      <h2 class="section-title">Տեսարժան վայրեր</h2>

      <div class="places">

        <div class="place-card">
          <img src="https://images.unsplash.com/photo-1578645510447-e20b4311e3ce?q=80&w=1200&auto=format&fit=crop">
          <h3>Տաթևի Վանք</h3>
        </div>

        <div class="place-card">
          <img src="https://images.unsplash.com/photo-1528127269322-539801943592?q=80&w=1200&auto=format&fit=crop">
          <h3>Սևանա Լիճ</h3>
        </div>

        <div class="place-card">
          <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200&auto=format&fit=crop">
          <h3>Գառնի</h3>
        </div>

        <div class="place-card">
          <img src="https://images.unsplash.com/photo-1512453979798-5ea266f8880c?q=80&w=1200&auto=format&fit=crop">
          <h3>Դիլիջան</h3>
        </div>

      </div>

      <!-- CONTACT -->
      <div class="contact-section">

        <h2>Ձեր հարմար ճանապարհը սկսվում է այստեղ</h2>

        <div class="contact-buttons">

          <a href="#">+374 99 000 000</a>

          <a href="#">WhatsApp</a>

          <a href="#">Telegram</a>

        </div>

      </div>

    </div>

  </section>

</body>
</html>
