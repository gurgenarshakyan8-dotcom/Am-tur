<head>

<title>AM-Tur</title>

rel="stylesheet"
href="main.css">

</head>

<body>

<!-- HERO -->

<img

)
"

>

<div class="play-btn">

</div>

<h3>

Garni Temple

</h3>

</div>


<!-- HAGHPAT -->

<div class="place-card">

<img

src="https://images.unsplash.com/photo-1512453979798-5ea266f8880c?q=80&w=1200&auto=format&fit=crop"

onclick="
openVideo(
'https://www.youtube.com/embed/gm1L7m5r9ZI'
)
"

>

<h3>

</h3>

</div>

</section>


<!-- CARS -->

<section class="cars-section">

<div class="cars">

<div class="car-card">

<img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?q=80&w=1200&auto=format&fit=crop">

</div>

<div class="car-card">

<img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=1200&auto=format&fit=crop">

</div>

<div class="car-card">

<img src="https://images.unsplash.com/photo-1549399542-7e3f8b79c341?q=80&w=1200&auto=format&fit=crop">

</div>

<!-- INFO -->

<section class="info-section">

<div class="info-boxes">

<div class="info-card">

<h3>

Comfort

</h3>

</div>

<div class="info-card">

<h3>

Safety

</h3>

</div>

<div class="info-card">

<h3>

Professional Drivers

</h3>

</div>

<div class="info-card">

<h3>

24/7 Service

</h3>

</div>

</div>

</section>


<!-- VIDEO POPUP -->

<div
class="video-popup"
id="videoPopup">

<div class="video-box">

<div

class="close-video"

onclick="closeVideo()"

>

✕

</div>

<iframe

id="videoFrame"

allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"

allowfullscreen

>

</iframe>

</div>

</div>


<script>

function openVideo(url){

document
.getElementById(
"videoPopup"
).style.display="flex"

document
.getElementById(
"videoFrame"
).src=url

}

function closeVideo(){

document
.getElementById(
"videoPopup"
).style.display="none"

document
.getElementById(
"videoFrame"
).src=""

}

</script>


</body>

</html>
